<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Yash Soni</title>
  <desc id="desc">Founder and AI engineer at Apex36 Technologies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="1" stop-color="#0b1224"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="0.55" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="340" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1200" height="340" rx="20"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .drift-a { animation: driftA 14s ease-in-out infinite alternate; }
      .drift-b { animation: driftB 18s ease-in-out infinite alternate; }
      @keyframes driftA { from { transform: translate(0, 0); } to { transform: translate(90px, 30px); } }
      @keyframes driftB { from { transform: translate(0, 0); } to { transform: translate(-110px, -24px); } }
      .rise { animation: rise 0.9s ease-out backwards; }
      .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.35s; } .d3 { animation-delay: 0.6s; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .role { opacity: 0; animation: cycle 12s infinite; }
      .r1 { opacity: 1; }
      .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; } .r4 { animation-delay: 9s; }
      @keyframes cycle { 0% { opacity: 0; } 3% { opacity: 1; } 22% { opacity: 1; } 25% { opacity: 0; } 100% { opacity: 0; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 70px 286px; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) {
        .drift-a, .drift-b, .pulse { animation: none; }
        .rise { animation: none; }
        .role { animation: none; } .r1 { opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)" mask="url(#gridMask)" opacity="0.6"/>
    <circle class="drift-a" cx="930" cy="90" r="260" fill="url(#orbA)"/>
    <circle class="drift-b" cx="1080" cy="300" r="240" fill="url(#orbB)"/>

    <g class="sans">
      <text class="rise d1 mono" x="70" y="88" font-size="16" fill="#7dd3fc" letter-spacing="3">HI, I'M</text>
      <text class="rise d2" x="66" y="160" font-size="76" font-weight="800" fill="url(#name)" letter-spacing="-2">Yash Soni</text>
      <text class="rise d3" x="70" y="204" font-size="24" fill="#cbd5e1">Founder &amp; AI engineer · AI and SaaS builds for startups and agencies</text>
    </g>

    <g class="mono" font-size="20">
      <text x="70" y="250" fill="#64748b">$</text>
      <text x="92" y="250" fill="#94a3b8">building</text>
      <text class="role r1" x="196" y="250" fill="#e2e8f0">RAG &amp; agent systems that ship to production</text>
      <text class="role r2" x="196" y="250" fill="#e2e8f0">multi-tenant SaaS, end to end</text>
      <text class="role r3" x="196" y="250" fill="#e2e8f0">prototypes into production-grade products</text>
      <text class="role r4" x="196" y="250" fill="#e2e8f0">fixes for open-source compilers, in Rust</text>
    </g>

    <g class="sans" font-size="15">
      <circle class="pulse" cx="70" cy="286" r="5" fill="#22c55e"/>
      <text x="84" y="291" fill="#94a3b8">Founder, Apex36 Technologies · Mumbai, India · Clients in the US, UK and Germany</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="339" rx="20" fill="none" stroke="#1e293b"/>
  </g>
</svg>
