<svg xmlns="http://www.w3.org/2000/svg" width="400" height="210" viewBox="0 0 400 210" role="img" aria-label="CC Logins">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1224"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .glow { animation: breathe 6s ease-in-out infinite; }
      @keyframes breathe { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .glow { animation: none; } }
    </style>
  </defs>
  <rect width="400" height="210" rx="16" fill="url(#bg)"/>
  <rect class="glow" width="400" height="210" rx="16" fill="url(#glow)"/>
  <rect x="24" y="24" width="4" height="24" rx="2" fill="#f97316"/>
  <text class="mono" x="38" y="41" font-size="13" letter-spacing="1.5" fill="#fb923c">RUST · TAURI 2 · DESKTOP</text>
  <text class="sans" x="24" y="92" font-size="32" font-weight="700" fill="#f1f5f9">CC Logins</text>
  <text class="sans" x="24" y="128" font-size="18" fill="#94a3b8">See every account&apos;s quota,</text>
  <text class="sans" x="24" y="152" font-size="18" fill="#94a3b8">switch Claude Code in one click.</text>
  <text class="sans" x="24" y="188" font-size="15" fill="#64748b">Open source · MIT</text>
  <text class="sans" x="376" y="188" font-size="15" font-weight="600" text-anchor="end" fill="#fb923c">View →</text>
  <rect x="0.5" y="0.5" width="399" height="209" rx="16" fill="none" stroke="#1e293b"/>
</svg>
